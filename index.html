<!DOCTYPE html>
<html>
<head>
  <title>Betway Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; background: #111; color: #fff; }
    input { padding: 12px; width: 80%; max-width: 300px; margin: 10px; border: none; border-radius: 5px; }
    button { padding: 12px 24px; background: #00a826; color: white; border: none; border-radius: 5px; font-size: 16px; }
    .disclaimer { font-size: 11px; color: #888; margin-top: 30px; }
  </style>
</head>
<body>
  <h2>Betway Betslip Loader</h2>
  <p>Paste your code below:</p>
  <input type="text" id="codeInput" placeholder="Enter Betway Code">
  <br>
  <button onclick="loadBetslip()">Open in Betway</button>
  <p class="disclaimer">18+ Only. Not affiliated with Betway. Codes expire.</p>

  <script>
    function loadBetslip() {
      const code = document.getElementById('codeInput').value.trim();
      if(!code) return alert('Enter a code mf2');
      // NEW Betway format 2026
      window.location.href = "https://www.betway.co.za/betslip?shared=" + code;
    }
  </script>
</body>
</html>
